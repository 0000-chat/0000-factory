name: Dispatch Factory release

on:
  push:
    branches:
      - codex/weekly-planning-archive
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FACTORY_REPOSITORY: https://github.com/0000-chat/0000-factory.git
  FACTORY_BRANCH: codex/weekly-planning-archive

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release channel
        uses: actions/checkout@v4
        with:
          ref: codex/weekly-planning-archive
          fetch-depth: 1

      - name: Write immutable release manifest
        id: manifest
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ID: factory-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node > "$RUNNER_TEMP/factory-release.json" <<'NODE'
          const manifest = {
            schemaVersion: 1,
            releaseId: process.env.RELEASE_ID,
            repository: process.env.FACTORY_REPOSITORY,
            branch: process.env.FACTORY_BRANCH,
            commit: process.env.RELEASE_SHA,
            consumers: [
              { repository: 'kapitolph/nextpay-team-delivery', branch: 'main', liveUrl: 'https://tracker.nextfinancial.xyz' },
              { repository: 'donmasakayan/nextpay-strategy', branch: 'main', liveUrl: 'https://tracker.nextpay.0000.gold' },
            ],
          };
          if (!/^[0-9a-f]{40}$/.test(manifest.commit)) throw new Error('release commit must be a full SHA');
          process.stdout.write(`${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Archive the release manifest
        uses: actions/upload-artifact@v4
        with:
          name: factory-release-${{ steps.manifest.outputs.release_id }}
          path: ${{ runner.temp }}/factory-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch the immutable release to both consumers
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.manifest.outputs.release_sha }}
          RELEASE_ID: ${{ steps.manifest.outputs.release_id }}
          FACTORY_REPOSITORY: ${{ env.FACTORY_REPOSITORY }}
          FACTORY_BRANCH: ${{ env.FACTORY_BRANCH }}
          FACTORY_RELEASE_TOKEN: ${{ secrets.FACTORY_RELEASE_TOKEN }}
        with:
          github-token: ${{ secrets.FACTORY_RELEASE_TOKEN }}
          script: |
            const targets = [
              { owner: 'kapitolph', repo: 'nextpay-team-delivery', liveUrl: 'https://tracker.nextfinancial.xyz' },
              { owner: 'donmasakayan', repo: 'nextpay-strategy', liveUrl: 'https://tracker.nextpay.0000.gold' },
            ];
            if (!/^[0-9a-f]{40}$/.test(process.env.RELEASE_SHA)) {
              core.setFailed('release dispatch requires a full immutable Factory SHA');
              return;
            }
            if (!process.env.FACTORY_RELEASE_TOKEN) {
              core.setFailed('FACTORY_RELEASE_TOKEN is required for cross-repository dispatch');
              return;
            }
            const failures = [];
            for (const target of targets) {
              try {
                await github.rest.repos.createDispatchEvent({
                  owner: target.owner,
                  repo: target.repo,
                  event_type: 'factory-release',
                  client_payload: {
                    schema_version: '1',
                    release_id: process.env.RELEASE_ID,
                    factory_repository: process.env.FACTORY_REPOSITORY,
                    factory_branch: process.env.FACTORY_BRANCH,
                    factory_sha: process.env.RELEASE_SHA,
                    live_url: target.liveUrl,
                    sent_at: new Date().toISOString(),
                  },
                });
                core.info(`dispatched ${target.owner}/${target.repo} at ${process.env.RELEASE_SHA}`);
              } catch (error) {
                failures.push(`${target.owner}/${target.repo}: ${error.message}`);
              }
            }
            if (failures.length) core.setFailed(`release dispatch failed: ${failures.join('; ')}`);
