name: Record Factory consumer result

on:
  repository_dispatch:
    types:
      - factory-release-result

permissions:
  contents: read

jobs:
  result:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the release channel
        uses: actions/checkout@v4
        with:
          ref: codex/weekly-planning-archive
          fetch-depth: 1

      - name: Validate and record consumer receipt
        id: receipt
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node > "$RUNNER_TEMP/factory-consumer-receipt.json" <<'NODE'
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const sha = String(payload.factory_sha || '');
          const repository = String(payload.factory_repository || '');
          const branch = String(payload.factory_branch || '');
          const status = String(payload.status || 'failed');
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('consumer receipt requires a full Factory SHA');
          if (repository !== 'https://github.com/0000-chat/0000-factory.git') throw new Error('consumer receipt repository mismatch');
          if (branch !== 'codex/weekly-planning-archive') throw new Error('consumer receipt branch mismatch');
          const receipt = { schemaVersion: 1, receivedAt: new Date().toISOString(), ...payload };
          process.stdout.write(`${JSON.stringify(receipt, null, 2)}\n`);
          if (status !== 'success' && status !== 'converged') process.exitCode = 1;
          NODE
          test -s "$RUNNER_TEMP/factory-consumer-receipt.json"

      - name: Archive consumer receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-consumer-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/factory-consumer-receipt.json
          if-no-files-found: error
          retention-days: 30
