name: Verify Factory consumer runtimes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      release_id:
        required: false
        type: string
      release_sha:
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: factory-release-runtime-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the control branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify both public runtime provenance endpoints
        env:
          EXPECTED_RELEASE_ID: ${{ inputs.release_id || '' }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { reduceReceipts, validateManifest } from './scripts/factory-release-receipt.mjs';

          const manifest = JSON.parse(fs.readFileSync('releases/current.json', 'utf8'));
          validateManifest(manifest);
          if (process.env.EXPECTED_RELEASE_ID && process.env.EXPECTED_RELEASE_ID !== manifest.releaseId) {
            console.log(`::notice::release ${process.env.EXPECTED_RELEASE_ID} is superseded by ${manifest.releaseId}`);
            process.exit(0);
          }
          const receipts = [];
          for (const consumer of manifest.consumers) {
            const url = `${consumer.liveUrl}/factory-provenance.json?release_id=${encodeURIComponent(manifest.releaseId)}`;
            const requestUrl = `${url}&nonce=${process.env.RUN_ID}-${process.env.RUN_ATTEMPT}`;
            let status = 0;
            let body = null;
            try {
              const response = await fetch(requestUrl, { cache: 'no-store', signal: AbortSignal.timeout(20_000) });
              status = response.status;
              if (status === 200) body = await response.json();
            } catch (error) {
              console.log(`::notice::${consumer.repository} provenance pending: ${error.message}`);
            }
            const verified = status === 200
              && body?.schemaVersion === 1
              && body.factory?.repository === manifest.repository
              && body.factory?.branch === manifest.branch
              && body.factory?.commit === manifest.commit;
            const receipt = {
              schema_version: '1',
              release_id: manifest.releaseId,
              consumer_repository: consumer.repository,
              factory_repository: manifest.repository,
              factory_branch: manifest.branch,
              factory_sha: manifest.commit,
              status: verified ? 'deployed' : 'triggered',
              sync_state: verified ? 'runtime-verified' : 'pending-deployment',
              deployment_status: verified ? 'verified-public-provenance' : 'pending-public-provenance',
              runtime_factory_sha: verified ? body.factory.commit : null,
              live_status: verified ? 'verified' : 'pending',
              live_http_status: status,
              live_url: consumer.liveUrl,
              runtime_request_cache_busted: true,
              ...(verified ? { runtime_proof: { kind: 'public-provenance', status, factory_sha: body.factory.commit, url } } : {}),
            };
            receipts.push(receipt);
            const slug = consumer.repository.replace(/[^A-Za-z0-9_.-]+/g, '_');
            const directory = path.join('release-receipts', manifest.releaseId);
            fs.mkdirSync(directory, { recursive: true });
            fs.writeFileSync(path.join(directory, `${slug}.json`), `${JSON.stringify(receipt, null, 2)}\n`);
          }
          const reduced = reduceReceipts(manifest, receipts);
          const directory = path.join('release-receipts', manifest.releaseId);
          fs.writeFileSync(path.join(directory, 'complete.json'), `${JSON.stringify({ schemaVersion: 1, releaseId: manifest.releaseId, factorySha: manifest.commit, state: reduced.state, repositories: reduced.repositories }, null, 2)}\n`);
          console.log(JSON.stringify({ releaseId: manifest.releaseId, factorySha: manifest.commit, state: reduced.state, repositories: reduced.repositories }, null, 2));
          NODE

      - name: Publish the joined runtime receipt
        run: |
          if git diff --quiet -- release-receipts; then
            echo 'runtime receipt unchanged'
            exit 0
          fi
          git config user.name 'Factory release bot'
          git config user.email 'factory-release-bot@users.noreply.github.com'
          git add release-receipts
          git commit -m "ci: verify Factory consumer runtimes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
